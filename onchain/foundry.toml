[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read-write", path = "./deployments" }, { access = "read", path = "./data" }]
remappings = ["@openzeppelin/=lib/openzeppelin-contracts/", "forge-std/=lib/forge-std/src/"]

[rpc_endpoints]
robinhood_testnet = "${RH_TESTNET_RPC}"

[etherscan]
robinhood_testnet = { key = "blockscout", url = "https://explorer.testnet.chain.robinhood.com/api", chain = 46630 }
